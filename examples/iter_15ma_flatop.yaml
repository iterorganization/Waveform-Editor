# ITER 15 MA flat-top scenario — small sine variations around the Q=10 operating point
#
# All waveforms oscillate around the reference flat-top value with
# ±1–3 % amplitude over one 100 s cycle.
#
# Reference values: ITER Physics Basis (Nuclear Fusion 39, 2137, 1999)

globals:
  dd_version: 4.0.0
  machine_description: {}

NICE Shape:
  # Elongation: oscillates ±0.02 around 1.70
  kappa:
  - {type: sine, min: 1.68, max: 1.72, period: 100, duration: 500}
  # Triangularity: oscillates ±0.01 around 0.35
  delta:
  - {type: sine, min: 0.34, max: 0.36, period: 100, duration: 500}
  # Minor radius (m): oscillates ±0.02 m around 2.00 m
  a:
  - {type: sine, min: 1.98, max: 2.02, period: 100, duration: 500}
  # Geometric centre R (m): fixed at ITER major radius
  center_r:
  - {type: constant, value: 6.2, duration: 500}
  # Geometric centre Z (m): oscillates ±0.01 m around 0.545
  center_z:
  - {type: sine, min: 0.535, max: 0.555, period: 100, duration: 500}
  # X-point location R (m)
  rx:
  - {type: constant, value: 5.089, duration: 500}
  # X-point location Z (m)
  zx:
  - {type: constant, value: -3.346, duration: 500}

NICE Properties:
  # Plasma current (A): oscillates ±0.1 MA around -15 MA
  ip:
  - {type: sine, min: -15100000.0, max: -14900000.0, period: 100, duration: 500}
  # Vacuum toroidal field at R0 (T)
  b0:
  - {type: constant, value: -5.3, duration: 500}
  # Reference major radius for b0 (m)
  r0:
  - {type: constant, value: 6.2, duration: 500}
  # Current profile α: oscillates ±0.02 around 0.50
  profile_alpha:
  - {type: sine, min: 0.48, max: 0.52, period: 100, duration: 500}
  # Current profile β: oscillates ±0.02 around 0.50
  profile_beta:
  - {type: sine, min: 0.48, max: 0.52, period: 100, duration: 500}
  # Current profile γ
  profile_gamma:
  - {type: constant, value: 1.0, duration: 500}
