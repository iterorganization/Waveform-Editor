# EasyBuild configuration for the modules on the CEA partner zone, see README.md.
# Use: export EASYBUILD_CONFIGFILES=<this file>, or eb --configfiles=<this file>
[config]
# Modules and software for everyone, in a folder readable by colleagues
prefix = %(HOME)s/public/easybuild
# Build and downloads in /tmp, so that they do not count in the home quota
buildpath = /tmp/%(USER)s/easybuild/build
sourcepath = /tmp/%(USER)s/easybuild/sources
containerpath = /tmp/%(USER)s/easybuild/containers
robot-paths = %(DEFAULT_ROBOT_PATHS)s
modules-tool = EnvironmentModules
# The RPATH compiler wrappers break the build of the SuiteSparse bundled in NICE;
# the modules set LD_LIBRARY_PATH instead
rpath = False
module-syntax = Tcl

[override]
# Readable by colleagues (same group "users")
umask = 022
